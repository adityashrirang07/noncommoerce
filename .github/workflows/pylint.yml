# ============================================================
# 🚀 GitHub Action: Python Code Quality and Style Check (Pylint)
# Runs automatically on Pull Requests to ensure clean, maintainable code.
# Displays inline errors and friendly summary output.
# ============================================================

name: 🧹 Python Code Quality Check (Pylint)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 📥 Checkout code with full history (required for git diff)
      # --------------------------------------------------------
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 🐍 Setup Python environment
      # --------------------------------------------------------
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 📦 Install dependencies
      # --------------------------------------------------------
      - name: 📥 Install dependencies & pylint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      # --------------------------------------------------------
      # 🔍 Run pylint only on changed .py files
      # --------------------------------------------------------
      - name: 🔍 Run Pylint on changed Python files
        run: |
          # Determine changed Python files between main and PR commit
          changed_files=$(git diff --name-only origin/main...HEAD | grep -E "\.py$")
          echo "Changed Python Files: $changed_files"

          if [ -n "$changed_files" ]; then
            echo "Running pylint and generating report..."
            pylint $changed_files --fail-on=warning | tee pylint-report.txt
          else
            echo "⚠ No Python files changed. Skipping lint."
          fi

      # --------------------------------------------------------
      # 📊 Upload pylint report summary into PR page
      # --------------------------------------------------------
      - name: 📊 Upload pylint summary report
        if: always()
        run: |
          echo "### 🧹 Pylint Report Summary" >> $GITHUB_STEP_SUMMARY
          cat pylint-report.txt >> $GITHUB_STEP_SUMMARY

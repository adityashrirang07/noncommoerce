name: 🧹 Pylint Quality Check

# Trigger workflow on PRs or direct pushes to main
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  pylint:
    name: 🚀 Run Pylint on Changed Python Files
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # 1️⃣  Checkout Repo Code
      # --------------------------
      - name: 📦 Checkout Repository
        uses: actions/checkout@v3

      # --------------------------
      # 2️⃣  Setup Python runtime
      # --------------------------
      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --------------------------
      # 3️⃣  Install Required dependencies
      # --------------------------
      - name: 📦 Install Dependencies
        run: |
          pip install pylint

      # ---------------------------------------------------------
      # 4️⃣  Detect only changed Python files between main & PR
      # ---------------------------------------------------------
      - name: 🔍 Determine changed Python files
        id: changed-files
        run: |
          echo "Searching for changed Python files..."
          changed_files=$(git diff --name-only origin/main...HEAD | grep -E "\.py$" || true)
          echo "changed_files=$changed_files" >> $GITHUB_OUTPUT
          echo "Changed Python Files: $changed_files"

      # -----------------------------------------------------------------
      # 5️⃣  Run Pylint with score enforcement (fail if score < 10)
      # -----------------------------------------------------------------
      - name: 🧪 Run Pylint on changed Python files
        if: steps.changed-files.outputs.changed_files != ''
        run: |
          echo "Running pylint and generating report..."
          pylint ${{ steps.changed-files.outputs.changed_files }} --fail-under=10 | tee pylint-report.txt

      # --------------------------------------------------------------
      # 6️⃣  Upload pylint report for viewing inside GitHub Actions UI
      # --------------------------------------------------------------
      - name: 📄 Upload Pylint Report
        uses: actions/upload-artifact@v3
        with:
          name: pylint-report
          path: pylint-report.txt

      # --------------------------------------------------------------
      # 7️⃣  If no Python files changed — skip lint politely
      # --------------------------------------------------------------
      - name: ⚠ Skip Pylint (No Python changes detected)
        if: steps.changed-files.outputs.changed_files == ''
        run: echo "No Python files changed — skipping lint."

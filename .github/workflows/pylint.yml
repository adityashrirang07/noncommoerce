# ============================================================
# 🚀 GitHub Action: Python Code Quality and Style Check (Pylint)
# Runs automatically on Pull Requests to ensure clean, maintainable code.
# Displays inline error annotations and friendly log output.
# ============================================================

name: 🧹 Python Code Quality Check (Pylint)

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write   # Required to show inline comments in PR

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 📥 Checkout code
      # --------------------------------------------------------
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 🐍 Setup Python
      # --------------------------------------------------------
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 📦 Install dependencies
      # --------------------------------------------------------
      - name: 📥 Install dependencies & pylint
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      # --------------------------------------------------------
      # 🔍 Run pylint and annotate results
      # --------------------------------------------------------
      - name: 🔍 Run Pylint on changed Python files
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD | grep -E "\.py$")
          echo "Changed Python Files: $changed_files"
          
          if [ -n "$changed_files" ]; then
             echo "Running pylint..."
             pylint $changed_files --output-format=parseable --score=yes | tee pylint-report.txt
          else
             echo "⚠ No Python files changed. Skipping lint."
          fi

      # --------------------------------------------------------
      # 📊 Upload Report Summary
      # --------------------------------------------------------
      - name: 📊 Upload pylint summary report
        if: always()
        run: |
          echo "### 🧹 Pylint Report Summary" >> $GITHUB_STEP_SUMMARY
          cat pylint-report.txt >> $GITHUB_STEP_SUMMARY

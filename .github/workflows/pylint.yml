# ============================================================
# GitHub Actions Workflow: Pylint Quality Check
# This workflow runs automatically on every Pull Request to main
# It checks only modified .py files and fails if lint errors exist
# ============================================================

name: Pylint Quality Check   # Visible name inside GitHub Actions tab

on:
  pull_request:              # Trigger workflow when PR is created or updated
    branches: [ "main" ]     # Only for PRs targeting "main" branch

jobs:
  pylint:
    runs-on: ubuntu-latest   # Use latest Linux runner environment in GitHub

    steps:
      # --------------------------------------------------------
      # STEP 1: Checkout code from repository into the runner
      # fetch-depth: 0 enables full history so git diff works accurately
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # Needed to compare current & previous commits

      # --------------------------------------------------------
      # STEP 2: Set up Python environment
      # This installs Python 3.10 in the runner
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # STEP 3: Install dependencies
      # - upgrade pip for reliable installation
      # - read and install libraries listed in requirements.txt
      # - install pylint tool
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      # --------------------------------------------------------
      # STEP 4: Run pylint ONLY on changed .py files
      # - git diff lists modified files between current commit & previous
      # - grep extracts only Python (.py) files
      # - if files exist, pylint runs against them
      # - if no python files changed, skip
      # --------------------------------------------------------
      - name: Run pylint on changed files
        run: |
          # Identify changed files that end with .py extension
          changed_files=$(git diff --name-only HEAD^ HEAD | grep -E "\.py$")
          
          # Print them in the logs
          echo "Changed files: $changed_files"
          
          # Check if there are any Python files to lint
          if [ -n "$changed_files" ]; then
             pylint $changed_files     # Run pylint on those files
          else
             echo "No Python files changed."  # Skip if no .py files found
          fi
